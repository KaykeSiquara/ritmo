      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("ritmo:v1") || "{}").data;
          var theme = s && s.settings && s.settings.theme;
          if (theme === "light" || theme === "dark") document.documentElement.dataset.prTheme = theme;
        } catch (e) {}
      })();
